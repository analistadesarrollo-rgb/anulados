services:
  auth-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${AUTH_DB_DATABASE:-control_anulados_v2_auth}
      MARIADB_USER: ${AUTH_DB_USER:-control_v2}
      MARIADB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:?Set AUTH_DB_ROOT_PASSWORD in .env}
    volumes:
      - control-v2-auth:/var/lib/mysql
      - ./database/001-auth.sql:/docker-entrypoint-initdb.d/001-auth.sql:ro
    networks: [control-v2]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 3306
      API_PORT: 8080
    volumes:
      - ./api/oracle-client:/opt/oracle/client:ro
      - ./api/oracle-network:/opt/oracle/network/admin:ro
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [control-v2]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        VITE_PDV_INFO_URL: ${VITE_PDV_INFO_URL:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8086}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [control-v2]

volumes:
  control-v2-auth:

networks:
  control-v2:
    driver: bridge